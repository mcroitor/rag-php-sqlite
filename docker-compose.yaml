name: rag-php-sqlite

services:
  app:
    build: .
    container_name: rag_app
    entrypoint: ["/app/docker-entrypoint.sh"]
    command: ["php", "bin/serve.php", "0.0.0.0:8080"]
    ports:
      - "8080:8080"
    volumes:
      # Config override: point Ollama at the compose service (not localhost).
      - ./docker/config.yaml:/app/config/config.yaml:ro
      # SQLite database file is kept on the host (git-ignored) and shared with
      # any local CLI runs. Create it with `touch rag.sqlite` if missing.
      - ./rag.sqlite:/app/rag.sqlite
      # Documents to index live on the host.
      - ./documents:/app/documents:ro
      # Writable runtime area (web log, background job logs).
      - ./runtime:/app/runtime
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit((@file_get_contents('http://127.0.0.1:8080/api/health')!==false)?0:1);"]
      interval: 10s
      timeout: 5s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: rag_ollama
    volumes:
      # Persistent model storage.
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5
    restart: unless-stopped

volumes:
  ollama-data: