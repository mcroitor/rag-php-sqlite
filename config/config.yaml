# Ollama server configuration
ollama:
  base_url: http://localhost:11434  # Ollama API endpoint, compatible with OpenAI API

# Embedding model configuration
embedding:
  model: qwen3-embedding:4b  # Embedding model name (must be pulled in Ollama, ex. bge-m3, qwen3-embedding, embeddinggemma)
  dimension: 1024            # Vector dimension for embedding model (qwen3-embedding:0.6b = 760)
  max_tokens: 200            # Max tokens per chunk (smaller = more precise retrieval)
  safety_margin: 100          # Safety margin subtracted from max_tokens for chunk validation
  overlap: 50                # Token overlap between adjacent chunks (preserves context boundaries)
  retry: 3                   # Retry count for failed embedding requests

# LLM generation configuration
llm:
  model: qwen3.5:4b          # LLM model name (must be pulled in Ollama)
  temperature: 0.7           # Sampling temperature (0.0 = deterministic, 1.0 = creative)
  num_predict: 10240         # Max tokens to generate (output limit)
  context_window: 20480      # Context window sent to Ollama as num_ctx (model's max input tokens)

# Vector retrieval configuration
retrieval:
  top_k: 10                  # Number of candidates to retrieve from vector search
  threshold: 0.60            # Minimum cosine similarity score (0.0-1.0). qwen3-embedding:4b max ~0.5 for top matches. Lower = more recall, higher = more precision